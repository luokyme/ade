name: Report a crash
description: Ade is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Ade install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Ade
        2. Perform an action
        3. Ade crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Ade version and system specs
      description: |
        Open the command palette in Ade, then type “ade: copy system specs into clipboard”.
      placeholder: |
        Ade: v1.0.8
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Ade log file
      description: |
        Open the command palette in Ade, then type `ade: open log` to see the last 1000 lines. Or type `ade: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Ade.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
